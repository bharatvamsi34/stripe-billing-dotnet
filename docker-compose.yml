# Local stack: API + SQL Server. Secrets come from a .env file (see .env.example), never from this file.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: SqlServer
      Database__ApplyMigrationsOnStartup: "true"
      ConnectionStrings__Billing: "Server=sqlserver;Database=StripeBilling;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY in .env}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET in .env}
      Security__ApiKey: ${API_KEY:?set API_KEY in .env}
      Cors__AllowedOrigins__0: http://localhost:4200
